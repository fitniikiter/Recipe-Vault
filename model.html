<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ============================================================= -->
<!-- META / LINK-PREVIEW  (Caster sehen oft zuerst die Vorschau)   -->
<!-- ============================================================= -->
<title>FIT NIIKITER — Model Portfolio</title>
<meta name="description" content="Model & Creator aus Frankfurt am Main. Sedcard, Maße und Reichweite für Agenturen und Brand-Deals.">
<meta name="robots" content="index, follow">

<!-- Open Graph (Facebook, WhatsApp, LinkedIn ...) -->
<meta property="og:type" content="website">
<meta property="og:title" content="FIT NIIKITER — Model Portfolio">
<meta property="og:description" content="Model & Creator aus Frankfurt am Main. Sedcard & Reichweite für Agenturen und Brand-Deals.">
<meta property="og:url" content="https://model.fitniikiter.com">
<!-- og:image wird per JS aus CONFIG gesetzt (eine Stelle zum Ändern) -->
<meta property="og:image" content="" id="og-image">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="FIT NIIKITER — Model Portfolio">
<meta name="twitter:description" content="Model & Creator aus Frankfurt am Main.">
<meta name="twitter:image" content="" id="tw-image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">

<style>
/* =================================================================
   DESIGN TOKENS — eine dezente Akzentfarbe, neutrale Palette.
   Editorial / Modeagentur-Look: viel Weißraum, UI fast unsichtbar.
   ================================================================= */
:root{
  --bg:        #ffffff;
  --bg-alt:    #f5f4f2;   /* warmes off-white für abgesetzte Sektionen */
  --ink:       #111111;
  --ink-soft:  #6b6b6b;
  --line:      #e4e2de;
  --accent:    #b08d57;   /* dezentes Champagner/Gold als einzige Akzentfarbe */
  --maxw:      1180px;
  --gap:       clamp(14px, 2.5vw, 28px);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{display:block; max-width:100%; height:auto}
a{color:inherit; text-decoration:none}

.wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,5vw,40px)}

/* Ruhige, große, serifenlose Headlines */
.eyebrow{
  font-size:12px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--ink-soft); font-weight:600;
}
h2.section-title{
  font-size:clamp(26px,4.5vw,46px); font-weight:600; letter-spacing:-.02em;
  line-height:1.05; margin:.35em 0 .8em;
}

/* ============================ HERO ============================ */
.hero{
  position:relative; height:100svh; min-height:560px; width:100%;
  overflow:hidden; background:#0c0c0c;
}
.hero img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center 22%;
}
.hero::after{ /* leichter Verlauf für Lesbarkeit des Namens */
  content:""; position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 38%, rgba(0,0,0,.15) 100%);
}
.hero-content{
  position:absolute; left:0; right:0; bottom:clamp(28px,6vh,64px);
  z-index:2; color:#fff; text-align:center; padding:0 20px;
}
.hero-name{
  font-size:clamp(34px,9vw,82px); font-weight:600; letter-spacing:-.02em;
  line-height:.98; text-transform:uppercase;
}
.hero-handle{
  margin-top:.5em; font-size:clamp(13px,3.4vw,17px);
  letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.85);
}
.scroll-hint{
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
  z-index:2; color:rgba(255,255,255,.7); font-size:22px;
  animation:bob 2s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}

/* ============================ STATS ============================ */
.stats{padding:clamp(54px,9vw,110px) 0; background:var(--bg)}
.stats-grid{
  display:grid; grid-template-columns:repeat(2,1fr);
  gap:0; border-top:1px solid var(--line);
}
.stat{
  padding:18px 4px; border-bottom:1px solid var(--line);
}
.stat .label{
  font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft);
}
.stat .value{font-size:clamp(17px,2.4vw,21px); font-weight:600; margin-top:4px}
@media(min-width:680px){ .stats-grid{grid-template-columns:repeat(3,1fr); column-gap:48px} }
@media(min-width:980px){ .stats-grid{grid-template-columns:repeat(4,1fr)} }

/* ============================ GALERIE ============================ */
.gallery{padding:clamp(40px,7vw,90px) 0; background:var(--bg-alt)}
.grid{
  display:grid; grid-template-columns:1fr; gap:var(--gap);
}
@media(min-width:560px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media(min-width:920px){ .grid{grid-template-columns:repeat(3,1fr)} }
.tile{
  position:relative; overflow:hidden; background:#ddd; cursor:pointer;
  aspect-ratio:4/5; border:none; padding:0; width:100%; display:block;
}
.tile img{
  width:100%; height:100%; object-fit:cover;
  transition:transform .5s cubic-bezier(.2,.7,.2,1);
}
.tile:hover img, .tile:focus-visible img{transform:scale(1.04)}
.tile figcaption{
  position:absolute; left:0; bottom:0; right:0;
  padding:14px 14px 12px; color:#fff; font-size:12px;
  letter-spacing:.14em; text-transform:uppercase; text-align:left;
  background:linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,0));
  opacity:0; transition:opacity .3s;
}
.tile:hover figcaption, .tile:focus-visible figcaption{opacity:1}
.tile:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* ============================ CREATOR ============================ */
.creator{padding:clamp(54px,9vw,110px) 0; background:var(--bg)}
.creator-grid{
  display:grid; grid-template-columns:1fr; gap:var(--gap); margin-top:8px;
}
@media(min-width:720px){ .creator-grid{grid-template-columns:repeat(3,1fr)} }
.channel{
  border:1px solid var(--line); padding:24px 22px; text-align:center;
  transition:border-color .2s, transform .2s;
}
.channel:hover{border-color:var(--accent); transform:translateY(-3px)}
.channel .platform{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft)}
.channel .count{font-size:clamp(26px,4vw,38px); font-weight:600; margin:6px 0 2px; letter-spacing:-.02em}
.channel .at{font-size:13px; color:var(--accent); font-weight:600}

/* ============================ KONTAKT ============================ */
.contact{padding:clamp(54px,10vw,120px) 0; background:#0c0c0c; color:#fff; text-align:center}
.contact .section-title{color:#fff}
.contact a.mail{
  display:inline-block; margin-top:6px;
  font-size:clamp(20px,4vw,34px); font-weight:600; letter-spacing:-.01em;
  border-bottom:1px solid rgba(255,255,255,.35); padding-bottom:4px;
}
.contact a.mail:hover{border-color:var(--accent); color:var(--accent)}
.socials{margin-top:34px; display:flex; gap:26px; justify-content:center; flex-wrap:wrap}
.socials a{
  font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  color:rgba(255,255,255,.7); transition:color .2s;
}
.socials a:hover{color:#fff}
footer{padding:26px 0; text-align:center; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-soft); background:#0c0c0c}

/* ============================ LIGHTBOX ============================ */
.lb{
  position:fixed; inset:0; z-index:100; display:none;
  background:rgba(10,10,10,.96); align-items:center; justify-content:center;
  touch-action:none;
}
.lb.open{display:flex}
.lb img{max-width:92vw; max-height:84vh; object-fit:contain; user-select:none}
.lb-btn{
  position:absolute; top:50%; transform:translateY(-50%);
  background:none; border:none; color:#fff; font-size:42px; line-height:1;
  cursor:pointer; padding:14px 18px; opacity:.7; transition:opacity .2s;
}
.lb-btn:hover{opacity:1}
.lb-prev{left:max(4px,2vw)} .lb-next{right:max(4px,2vw)}
.lb-close{top:max(10px,2vh); right:max(10px,2vw); transform:none; font-size:34px}
.lb-caption{
  position:absolute; bottom:max(14px,3vh); left:0; right:0; text-align:center;
  color:rgba(255,255,255,.75); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
}
@media(max-width:560px){ .lb-btn{font-size:34px; padding:10px 10px} }

/* Reveal-Animation (dezent, respektiert reduce-motion) */
.reveal{opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease}
.reveal.in{opacity:1; transform:none}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1; transform:none; transition:none}
  .scroll-hint{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<!-- HERO -->
<header class="hero">
  <img id="hero-img" alt="Headshot FIT NIIKITER" fetchpriority="high">
  <div class="hero-content">
    <div class="hero-name" id="hero-name"></div>
    <div class="hero-handle" id="hero-handle"></div>
  </div>
  <a href="#stats" class="scroll-hint" aria-label="Nach unten scrollen">&#8595;</a>
</header>

<!-- STATS / SEDCARD -->
<section class="stats" id="stats">
  <div class="wrap">
    <p class="eyebrow">Sedcard</p>
    <h2 class="section-title reveal">Stats</h2>
    <div class="stats-grid reveal" id="stats-grid"></div>
  </div>
</section>

<!-- GALERIE -->
<section class="gallery" id="portfolio">
  <div class="wrap">
    <p class="eyebrow">Portfolio</p>
    <h2 class="section-title reveal">Galerie</h2>
    <div class="grid" id="gallery-grid"></div>
  </div>
</section>

<!-- CREATOR / AUDIENCE  (separat, per CONFIG ausblendbar) -->
<section class="creator" id="creator" hidden>
  <div class="wrap">
    <p class="eyebrow">Creator</p>
    <h2 class="section-title reveal">Audience &amp; Reach</h2>
    <p class="reveal" style="max-width:560px;color:var(--ink-soft)" id="creator-intro"></p>
    <div class="creator-grid reveal" id="creator-grid"></div>
  </div>
</section>

<!-- KONTAKT -->
<section class="contact" id="contact">
  <div class="wrap">
    <p class="eyebrow" style="color:var(--accent)">Kontakt</p>
    <h2 class="section-title reveal">Let's work together</h2>
    <a class="mail" id="contact-mail" href="#"></a>
    <div class="socials" id="contact-socials"></div>
  </div>
</section>

<footer id="footer"></footer>

<!-- LIGHTBOX -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Bildansicht">
  <button class="lb-btn lb-close" id="lb-close" aria-label="Schließen">&times;</button>
  <button class="lb-btn lb-prev"  id="lb-prev"  aria-label="Vorheriges Bild">&#8249;</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next"  id="lb-next"  aria-label="Nächstes Bild">&#8250;</button>
  <div class="lb-caption" id="lb-caption"></div>
</div>

<script>
/* =================================================================
   ┌───────────────────────────────────────────────────────────┐
   │  CONFIG — HIER ALLES ÄNDERN. Sonst nichts anfassen.         │
   │  • Bild-URLs: später Cloudflare-R2-Links eintragen.         │
   │  • Stats, Creator-Zahlen, Links, E-Mail: hier pflegen.      │
   └───────────────────────────────────────────────────────────┘
   ================================================================= */
const CONFIG = {

  /* --- Profil --------------------------------------------------- */
  name:   "FIT NIIKITER",
  handle: "@fitniikiter",
  email:  "booking@fitniikiter.com",          // TODO: echte Booking-Mail eintragen

  /* --- Bilder ---------------------------------------------------
     Leer lassen ("") => es wird automatisch ein sauberer
     beschrifteter Platzhalter angezeigt. Sobald du eine
     Cloudflare-R2-URL einträgst, wird das echte Bild geladen.     */
  images: {
    headshot_clean: "",   // Hero + erstes Galerie-Tile + Link-Vorschau (og:image)
    smile:          "",
    fullbody:       "",
    physique:       "",
    profile:        "",
    editorial:      ""
  },

  /* Welches Bild wird als Link-Vorschau (og:image) geteilt? */
  ogImageKey: "headshot_clean",

  /* --- Galerie-Reihenfolge & Beschriftung ----------------------
     key  = Schlüssel aus images{}   |  label = Anzeige im Tile     */
  gallery: [
    { key:"headshot_clean", label:"Headshot" },
    { key:"smile",          label:"Smile" },
    { key:"fullbody",       label:"Full Body" },
    { key:"physique",       label:"Physique" },
    { key:"profile",        label:"Profile" },
    { key:"editorial",      label:"Editorial" }
  ],

  /* --- Sedcard-Stats (Platzhalter = einfach hier ersetzen) ------ */
  stats: [
    { label:"Name",       value:"FIT NIIKITER" },
    { label:"Größe",      value:"180 cm" },
    { label:"Haare",      value:"Dunkelbraun, lockig" },
    { label:"Augen",      value:"—" },              // TODO
    { label:"Brust",      value:"— cm" },           // TODO
    { label:"Taille",     value:"— cm" },           // TODO
    { label:"Schuhgröße", value:"—" },              // TODO
    { label:"Standort",   value:"Frankfurt am Main" }
  ],

  /* --- Creator / Audience -------------------------------------- */
  showCreator: true,    // false => Sektion komplett ausgeblendet
  creatorIntro: "Eigene Reichweite als Food- & Lifestyle-Creator — relevant für Brand-Deals und Kooperationen.",
  channels: [
    { platform:"TikTok",    count:"—", at:"@fitniikiter", url:"https://tiktok.com/@fitniikiter" },
    { platform:"YouTube",   count:"—", at:"@fitniikiter", url:"https://youtube.com/@fitniikiter" },
    { platform:"Instagram", count:"—", at:"@fitniikiter", url:"https://instagram.com/fitniikiter" }
  ],

  /* --- Footer-Links (Kontaktsektion) --------------------------- */
  socials: [
    { label:"TikTok",    url:"https://tiktok.com/@fitniikiter" },
    { label:"YouTube",   url:"https://youtube.com/@fitniikiter" },
    { label:"Instagram", url:"https://instagram.com/fitniikiter" }
  ]
};
/* ============ ENDE CONFIG — ab hier nichts mehr ändern ============ */


/* ---------- Helfer: liefert echte URL oder SVG-Platzhalter ---------- */
function imgSrc(key, label){
  const url = CONFIG.images[key];
  if (url) return url;
  // Inline-SVG-Platzhalter (kein externer Request, klar beschriftet)
  const txt = (label || key).toUpperCase();
  const svg =
    `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='1000'>`+
    `<rect width='100%' height='100%' fill='#e8e6e2'/>`+
    `<rect x='1' y='1' width='798' height='998' fill='none' stroke='#cfccc6' stroke-width='2'/>`+
    `<text x='50%' y='47%' font-family='sans-serif' font-size='42' fill='#9a968f' `+
    `text-anchor='middle' letter-spacing='3'>${txt}</text>`+
    `<text x='50%' y='53%' font-family='sans-serif' font-size='20' fill='#bdb9b1' `+
    `text-anchor='middle' letter-spacing='2'>Bild folgt</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

/* ---------- Render: Hero ---------- */
document.getElementById('hero-name').textContent   = CONFIG.name;
document.getElementById('hero-handle').textContent = CONFIG.handle;
const heroImg = document.getElementById('hero-img');
heroImg.src = imgSrc('headshot_clean','Headshot');

/* ---------- Render: og:image (Link-Vorschau) ---------- */
(function(){
  const ogUrl = CONFIG.images[CONFIG.ogImageKey];
  if (ogUrl){
    document.getElementById('og-image').setAttribute('content', ogUrl);
    document.getElementById('tw-image').setAttribute('content', ogUrl);
  }
})();

/* ---------- Render: Stats ---------- */
document.getElementById('stats-grid').innerHTML = CONFIG.stats.map(s =>
  `<div class="stat"><div class="label">${s.label}</div><div class="value">${s.value}</div></div>`
).join('');

/* ---------- Render: Galerie ---------- */
document.getElementById('gallery-grid').innerHTML = CONFIG.gallery.map((g,i) =>
  `<button class="tile" data-i="${i}" aria-label="${g.label} öffnen">`+
    `<img loading="${i<2?'eager':'lazy'}" src="${imgSrc(g.key,g.label)}" alt="${CONFIG.name} — ${g.label}">`+
    `<figcaption>${g.label}</figcaption>`+
  `</button>`
).join('');

/* ---------- Render: Creator ---------- */
if (CONFIG.showCreator){
  const sec = document.getElementById('creator');
  sec.hidden = false;
  document.getElementById('creator-intro').textContent = CONFIG.creatorIntro;
  document.getElementById('creator-grid').innerHTML = CONFIG.channels.map(c =>
    `<a class="channel" href="${c.url}" target="_blank" rel="noopener">`+
      `<div class="platform">${c.platform}</div>`+
      `<div class="count">${c.count}</div>`+
      `<div class="at">${c.at}</div>`+
    `</a>`
  ).join('');
}

/* ---------- Render: Kontakt ---------- */
const mail = document.getElementById('contact-mail');
mail.textContent = CONFIG.email;
mail.href = 'mailto:' + CONFIG.email;
document.getElementById('contact-socials').innerHTML = CONFIG.socials.map(s =>
  `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`
).join('');
document.getElementById('footer').textContent =
  `© ${new Date().getFullYear()} ${CONFIG.name} · ${CONFIG.handle}`;

/* ================= LIGHTBOX (schlicht, ohne Library) ================= */
(function(){
  const lb      = document.getElementById('lb');
  const lbImg   = document.getElementById('lb-img');
  const lbCap   = document.getElementById('lb-caption');
  let idx = 0;

  function show(i){
    const n = CONFIG.gallery.length;
    idx = (i + n) % n;                       // wrap-around
    const g = CONFIG.gallery[idx];
    lbImg.src = imgSrc(g.key, g.label);
    lbImg.alt = `${CONFIG.name} — ${g.label}`;
    lbCap.textContent = g.label;
  }
  function open(i){ show(i); lb.classList.add('open'); document.body.style.overflow='hidden'; }
  function close(){ lb.classList.remove('open'); document.body.style.overflow=''; }

  document.getElementById('gallery-grid').addEventListener('click', e=>{
    const t = e.target.closest('.tile');
    if (t) open(parseInt(t.dataset.i,10));
  });
  document.getElementById('lb-close').onclick = close;
  document.getElementById('lb-prev').onclick  = ()=>show(idx-1);
  document.getElementById('lb-next').onclick  = ()=>show(idx+1);
  lb.addEventListener('click', e=>{ if(e.target===lb) close(); });

  document.addEventListener('keydown', e=>{
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape')     close();
    if(e.key==='ArrowLeft')  show(idx-1);
    if(e.key==='ArrowRight') show(idx+1);
  });

  // Swipe (mobile)
  let x0=null;
  lb.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend',   e=>{
    if(x0===null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx)>45) show(idx + (dx<0 ? 1 : -1));
    x0=null;
  });
})();

/* ================= Dezente Reveal-Animation ================= */
(function(){
  const els = document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, {threshold:.12});
  els.forEach(e=>io.observe(e));
})();
</script>
</body>
</html>
