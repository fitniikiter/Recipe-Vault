<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Fat Loss Guide — FIT NIIKITER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #080808; color: #fff; font-family: 'Bebas Neue', Impact, sans-serif; min-height: 100vh; }
    #root { max-width: 500px; margin: 0 auto; min-height: 100vh; }
    .btn { transition: all 0.18s ease; cursor: pointer; border: none; outline: none; }
    .btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); filter: brightness(0.95); }
    .card { transition: transform 0.18s ease; cursor: pointer; }
    .card:hover { transform: translateX(3px); }
    /* Range slider styling to match the dark neon theme */
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: #1c1c1c; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #E8FF47; cursor: pointer; border: 3px solid #080808; box-shadow: 0 0 0 1px #E8FF47; }
    input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #E8FF47; cursor: pointer; border: 3px solid #080808; }
    input[type=number], input[type=text] { font-family: 'Bebas Neue', sans-serif; }
    input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    @keyframes pop { 0% { transform: scale(0.96); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
    .pop { animation: pop 0.25s ease; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script>
const { useState, useMemo } = React;
const e = React.createElement;

// ── Theme accents ────────────────────────────────────────────────
const LIME = "#E8FF47";
const ORANGE = "#FF6B35";
const BLUE = "#47D4FF";
const PURPLE = "#B847FF";

// ── Activity levels (TDEE multipliers, Mifflin-St Jeor) ──────────
const ACTIVITY = [
  { id: "sed",   label: "Wenig", sub: "Bürojob, kaum Bewegung", mult: 1.2 },
  { id: "light", label: "Leicht", sub: "1–2× Sport / Woche", mult: 1.375 },
  { id: "mod",   label: "Aktiv", sub: "3–4× Sport / Woche", mult: 1.55 },
  { id: "high",  label: "Sehr aktiv", sub: "5–6× Sport / Woche", mult: 1.725 },
];

// ── Deficit options ──────────────────────────────────────────────
const DEFICITS = [
  { id: "soft", label: "SANFT", pct: 0.15, color: BLUE, sub: "Muskelschutz max · langsam" },
  { id: "std",  label: "STANDARD", pct: 0.20, color: LIME, sub: "Bester Kompromiss · empfohlen" },
  { id: "hard", label: "AGGRESSIV", pct: 0.25, color: ORANGE, sub: "Schnell · nur kurzfristig" },
];

const RULES = [
  { num: "01", color: LIME, title: "Kaloriendefizit ist König", body: "Fett verlierst du NUR im Defizit — weniger Kalorien rein als raus. Keine Diät, kein Tee, kein Lebensmittel verbrennt Fett. Nur das Defizit zählt. Alles andere macht es nur leichter." },
  { num: "02", color: ORANGE, title: "Protein ist nicht verhandelbar", body: "Ziel: ~2g pro kg Körpergewicht. Protein sättigt am stärksten, schützt deine Muskeln im Defizit und kostet beim Verdauen selbst Kalorien. Tracke Protein ZUERST — dann den Rest." },
  { num: "03", color: PURPLE, title: "Krafttraining hält die Muskeln", body: "Im Defizit will der Körper Muskeln abbauen. Krafttraining ist das Signal: 'Behalte sie.' Ohne Training verlierst du Muskeln statt Fett — und siehst danach 'skinny fat' aus statt definiert." },
  { num: "04", color: BLUE, title: "Schritte schlagen Cardio", body: "8.000–10.000 Schritte täglich verbrennen über den Tag mehr als 30 Min auf dem Laufband — und machen dich nicht so hungrig. NEAT (Alltagsbewegung) ist dein heimlicher Fat-Loss-Motor." },
  { num: "05", color: LIME, title: "Schlaf entscheidet mit", body: "7–8h Schlaf. Zu wenig Schlaf = mehr Hunger (Ghrelin hoch), weniger Sättigung (Leptin runter), schlechtere Regeneration. Schlechter Schlaf sabotiert das beste Defizit." },
  { num: "06", color: ORANGE, title: "Konsistenz > Perfektion", body: "Ein 'schlechter' Tag macht dich nicht dick — eine schlechte Woche schon. 80% sauber, 20% flexibel. Die Diät, die du durchhältst, schlägt die 'perfekte', die du nach 2 Wochen abbrichst." },
];

const FOODS = [
  { cat: "PROTEIN — die Basis", color: ORANGE, items: ["Magerquark / Skyr", "Hähnchen- & Putenbrust", "Eier / Eiklar", "Tilapia, Kabeljau, Thunfisch", "Mageres Rinderhack (5%)", "Whey Protein", "Magerer Harzer / Hüttenkäse"] },
  { cat: "VOLUMEN — füllt den Magen", color: BLUE, items: ["Gurke, Zucchini, Paprika", "Brokkoli, Blumenkohl", "Salat & Blattgemüse", "Tomaten", "Beeren (kalorienarm)", "Wassermelone", "Popcorn (luftgepoppt)"] },
  { cat: "SLOW CARBS — Energie", color: PURPLE, items: ["Kartoffeln & Süßkartoffeln", "Reis & Vollkornreis", "Haferflocken", "Vollkornnudeln", "Hülsenfrüchte (Linsen, Bohnen)", "Vollkornbrot"] },
  { cat: "SMART FATS — in Maßen", color: LIME, items: ["Olivenöl (abmessen!)", "Avocado (halbe)", "Nüsse (Handvoll)", "Leinsamen / Chia", "Fettiger Fisch (Lachs)"] },
];

const MISTAKES = [
  { wrong: "Kalorien trinken", right: "Säfte, Softdrinks, Latte, Alkohol — flüssige Kalorien sättigen NICHT. Trink Wasser, schwarzen Kaffee, Tee. Größter versteckter Diät-Killer.", color: ORANGE },
  { wrong: "Öl & Soßen nicht zählen", right: "1 EL Öl = ~100 kcal. Ein 'Spritzer' beim Anbraten + Dressing + Mayo = schnell 400 kcal unsichtbar. Öl IMMER abmessen, nicht schätzen.", color: ORANGE },
  { wrong: "Wochenende ignorieren", right: "Mo–Fr perfekt, Sa+So alles egal? 2 Tage Überschuss können das 5-Tage-Defizit komplett auffressen. Die Woche zählt als Ganzes.", color: ORANGE },
  { wrong: "Zu wenig essen / Crash-Diät", right: "1.000 kcal halten? Geht 2 Wochen, dann Heißhunger-Crash, Muskelverlust und Jojo. Lieber moderates Defizit, das du Monate durchhältst.", color: ORANGE },
  { wrong: "Sich täglich wiegen & verzweifeln", right: "Wasser, Salz, Verdauung, Zyklus — dein Gewicht schwankt 1–2 kg am Tag. Schau den Wochen-DURCHSCHNITT an, nicht die Tageszahl.", color: ORANGE },
  { wrong: "Nur Cardio, kein Kraftsport", right: "Stundenlang Laufband ohne Eisen = Muskelabbau. Der Körper wird kleiner, aber bleibt weich. Kraft + Defizit = der definierte Look.", color: ORANGE },
];

function App() {
  const [tab, setTab] = useState("calc");

  // Calculator state
  const [sex, setSex] = useState("m");
  const [age, setAge] = useState(25);
  const [weight, setWeight] = useState(80);
  const [height, setHeight] = useState(180);
  const [act, setAct] = useState("mod");
  const [deficit, setDeficit] = useState("std");

  const result = useMemo(() => {
    const w = Number(weight) || 0;
    const h = Number(height) || 0;
    const a = Number(age) || 0;
    if (!w || !h || !a) return null;
    // Mifflin-St Jeor BMR
    const bmr = sex === "m"
      ? 10 * w + 6.25 * h - 5 * a + 5
      : 10 * w + 6.25 * h - 5 * a - 161;
    const mult = ACTIVITY.find(x => x.id === act).mult;
    const tdee = Math.round(bmr * mult);
    const def = DEFICITS.find(x => x.id === deficit);
    const target = Math.round(tdee * (1 - def.pct));
    const kcalCut = tdee - target;
    const weekLoss = (kcalCut * 7 / 7700); // ~7700 kcal per kg fat
    // Macros: protein 2g/kg, fat 0.9g/kg, rest carbs
    const protein = Math.round(w * 2);
    const fat = Math.round(w * 0.9);
    const carbs = Math.max(0, Math.round((target - protein * 4 - fat * 9) / 4));
    return { bmr: Math.round(bmr), tdee, target, kcalCut, weekLoss, protein, fat, carbs, defColor: def.color };
  }, [sex, age, weight, height, act, deficit]);

  // ── Reusable label ──
  const eyebrow = (txt, mb = 10) => e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#383838", fontSize: 9, letterSpacing: 3, textTransform: "uppercase", marginBottom: mb } }, txt);

  const numberField = (label, val, set, unit) => e('div', { style: { background: "#0d0d0d", border: "1px solid #181818", borderRadius: 10, padding: "10px 14px", flex: 1 } },
    e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#383838", fontSize: 9, letterSpacing: 2, textTransform: "uppercase" } }, label),
    e('div', { style: { display: "flex", alignItems: "baseline", gap: 5 } },
      e('input', {
        type: "number", value: val,
        onChange: ev => set(ev.target.value),
        style: { width: "100%", background: "transparent", border: "none", color: "#fff", fontSize: 30, outline: "none", letterSpacing: 1 }
      }),
      e('span', { style: { fontFamily: "'DM Sans', sans-serif", color: "#333", fontSize: 13 } }, unit)
    )
  );

  return e('div', { style: { fontFamily: "'Bebas Neue', Impact, sans-serif", background: "#080808", minHeight: "100vh", color: "#fff", maxWidth: 500, margin: "0 auto" } },

    // ── HEADER ──
    e('div', { style: { padding: "28px 20px 20px", borderBottom: "1px solid #131313", position: "relative", overflow: "hidden" } },
      e('div', { style: { position: "absolute", top: -50, right: -50, width: 200, height: 200, background: `radial-gradient(circle, ${LIME}14 0%, transparent 65%)`, pointerEvents: "none" } }),
      eyebrow("Fett verlieren · ohne Bullshit", 6),
      e('div', { style: { fontSize: "clamp(30px, 9vw, 52px)", lineHeight: 0.95, letterSpacing: 2 } }, "FAT LOSS GUIDE"),
      e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#444", fontSize: 12, marginTop: 10 } }, "Dein Rechner + die Regeln, die wirklich zählen — by FIT NIIKITER")
    ),

    // ── TABS ──
    e('div', { style: { display: "flex", background: "#0c0c0c", borderBottom: "1px solid #151515", position: "sticky", top: 0, zIndex: 10 } },
      [{ id: "calc", label: "RECHNER" }, { id: "rules", label: "REGELN" }, { id: "food", label: "ESSEN" }, { id: "fail", label: "FEHLER" }].map(t =>
        e('button', {
          key: t.id, className: "btn", onClick: () => setTab(t.id),
          style: { flex: 1, padding: "13px 2px", fontSize: 13, letterSpacing: 0.5, background: "transparent", color: tab === t.id ? LIME : "#333", borderBottom: `2px solid ${tab === t.id ? LIME : "transparent"}`, fontFamily: "'Bebas Neue', sans-serif" }
        }, t.label)
      )
    ),

    // ════════ TAB: RECHNER ════════
    tab === "calc" && e(React.Fragment, null,
      e('div', { style: { padding: "16px 20px 0" } },
        eyebrow("1 · Deine Daten"),
        // Sex toggle
        e('div', { style: { display: "flex", background: "#0c0c0c", borderRadius: 10, padding: 4, border: "1px solid #181818", marginBottom: 10 } },
          [{ id: "m", l: "♂ MANN" }, { id: "w", l: "♀ FRAU" }].map(o =>
            e('button', { key: o.id, className: "btn", onClick: () => setSex(o.id),
              style: { flex: 1, padding: "10px", borderRadius: 7, fontSize: 17, letterSpacing: 1, background: sex === o.id ? LIME : "transparent", color: sex === o.id ? "#000" : "#383838", fontFamily: "'Bebas Neue', sans-serif" } }, o.l)
          )
        ),
        e('div', { style: { display: "flex", gap: 8, marginBottom: 8 } },
          numberField("Alter", age, setAge, "J"),
          numberField("Gewicht", weight, setWeight, "kg"),
          numberField("Größe", height, setHeight, "cm")
        )
      ),

      // Activity
      e('div', { style: { padding: "8px 20px 0" } },
        eyebrow("2 · Aktivität"),
        e('div', { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7 } },
          ACTIVITY.map(o =>
            e('button', { key: o.id, className: "btn", onClick: () => setAct(o.id),
              style: { textAlign: "left", padding: "11px 13px", borderRadius: 10, background: act === o.id ? "#11140a" : "#0c0c0c", border: `1px solid ${act === o.id ? LIME + "55" : "#161616"}`, fontFamily: "'Bebas Neue', sans-serif" } },
              e('div', { style: { fontSize: 18, color: act === o.id ? LIME : "#888", letterSpacing: 0.5 } }, o.label),
              e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#3c3c3c", fontSize: 10, marginTop: 2 } }, o.sub)
            )
          )
        )
      ),

      // Deficit
      e('div', { style: { padding: "16px 20px 0" } },
        eyebrow("3 · Tempo"),
        e('div', { style: { display: "flex", gap: 7 } },
          DEFICITS.map(o =>
            e('button', { key: o.id, className: "btn", onClick: () => setDeficit(o.id),
              style: { flex: 1, padding: "12px 6px", borderRadius: 10, textAlign: "center", background: deficit === o.id ? o.color : "#0c0c0c", color: deficit === o.id ? "#000" : "#444", border: `1px solid ${deficit === o.id ? o.color : "#161616"}`, fontFamily: "'Bebas Neue', sans-serif" } },
              e('div', { style: { fontSize: 17, letterSpacing: 0.5 } }, o.label),
              e('div', { style: { fontFamily: "'DM Sans', sans-serif", fontSize: 9, marginTop: 3, opacity: 0.8 } }, `-${o.pct * 100}%`)
            )
          )
        ),
        e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#3a3a3a", fontSize: 10, marginTop: 8, textAlign: "center" } }, DEFICITS.find(x => x.id === deficit).sub)
      ),

      // ── RESULT ──
      result && e('div', { className: "pop", style: { padding: "20px 20px 0" }, key: result.target },
        eyebrow("Dein Ergebnis"),
        // Main target calories
        e('div', { style: { background: "#0d0d0d", border: `1px solid ${result.defColor}40`, borderRadius: 14, padding: "18px", textAlign: "center", position: "relative", overflow: "hidden" } },
          e('div', { style: { position: "absolute", top: -40, right: -40, width: 160, height: 160, background: `radial-gradient(circle, ${result.defColor}18 0%, transparent 65%)`, pointerEvents: "none" } }),
          e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#383838", fontSize: 9, letterSpacing: 2, textTransform: "uppercase" } }, "Kalorien-Ziel pro Tag"),
          e('div', { style: { fontSize: 68, color: result.defColor, lineHeight: 1, margin: "4px 0" } }, result.target),
          e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#555", fontSize: 12 } }, `${result.kcalCut} kcal unter Erhaltung · ca. ${result.weekLoss.toFixed(2)} kg Fett / Woche`)
        ),
        // TDEE / BMR small
        e('div', { style: { display: "flex", gap: 7, marginTop: 7 } },
          [{ l: "Grundumsatz", v: result.bmr }, { l: "Erhaltung (TDEE)", v: result.tdee }].map((x, i) =>
            e('div', { key: i, style: { flex: 1, background: "#0b0b0b", border: "1px solid #161616", borderRadius: 10, padding: "11px 13px" } },
              e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#383838", fontSize: 9, letterSpacing: 1.5, textTransform: "uppercase" } }, x.l),
              e('div', { style: { fontSize: 26, color: "#888", lineHeight: 1.1, marginTop: 2 } }, `${x.v}`, e('span', { style: { fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#333" } }, " kcal"))
            )
          )
        ),
        // Macros
        e('div', { style: { marginTop: 14 } },
          eyebrow("Deine Makros · pro Tag"),
          e('div', { style: { display: "flex", gap: 7 } },
            [{ l: "Protein", v: result.protein, c: ORANGE }, { l: "Kohlenhydrate", v: result.carbs, c: BLUE }, { l: "Fett", v: result.fat, c: PURPLE }].map((m, i) =>
              e('div', { key: i, style: { flex: 1, background: "#0d0d0d", border: "1px solid #161616", borderRadius: 10, padding: "12px 10px", textAlign: "center" } },
                e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#383838", fontSize: 9, letterSpacing: 1, textTransform: "uppercase" } }, m.l),
                e('div', { style: { fontSize: 30, color: m.c, lineHeight: 1.1, marginTop: 3 } }, `${m.v}`, e('span', { style: { fontSize: 14, color: "#333" } }, "g"))
              )
            )
          )
        ),
        e('div', { style: { marginTop: 12, background: "#0a0a00", border: `1px solid ${LIME}15`, borderRadius: 10, padding: "12px 14px", fontFamily: "'DM Sans', sans-serif", color: "#888", fontSize: 12, lineHeight: 1.65 } },
          "💡 Richtwert nach Mifflin-St-Jeor. Starte hier, wiege dich 1–2 Wochen und korrigiere: ", e('br'),
          "Gewicht steht still → 150–200 kcal runter. Verlierst du >1% Körpergewicht/Woche → etwas mehr essen."
        ),
        e('div', { style: { height: 28 } })
      )
    ),

    // ════════ TAB: REGELN ════════
    tab === "rules" && e('div', { style: { padding: "16px 20px 32px" } },
      eyebrow("Die 6 Regeln, die alles entscheiden", 14),
      e('div', { style: { display: "flex", flexDirection: "column", gap: 8 } },
        RULES.map((r, i) =>
          e('div', { key: i, style: { background: "#0c0c0c", border: "1px solid #161616", borderRadius: 12, padding: "16px", display: "flex", gap: 14, position: "relative", overflow: "hidden" } },
            e('div', { style: { position: "absolute", left: 0, top: 0, bottom: 0, width: 3, background: r.color } }),
            e('div', { style: { fontSize: 30, color: r.color, lineHeight: 1, flexShrink: 0, minWidth: 30 } }, r.num),
            e('div', null,
              e('div', { style: { fontSize: 20, letterSpacing: 0.3, lineHeight: 1.05 } }, r.title),
              e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#888", fontSize: 13, marginTop: 6, lineHeight: 1.6 } }, r.body)
            )
          )
        )
      )
    ),

    // ════════ TAB: ESSEN ════════
    tab === "food" && e('div', { style: { padding: "16px 20px 32px" } },
      eyebrow("Was auf den Teller kommt", 14),
      e('div', { style: { display: "flex", flexDirection: "column", gap: 10 } },
        FOODS.map((f, i) =>
          e('div', { key: i, style: { background: "#0d0d0d", border: `1px solid ${f.color}22`, borderRadius: 12, padding: "14px 16px" } },
            e('div', { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 10 } },
              e('div', { style: { width: 8, height: 8, borderRadius: "50%", background: f.color } }),
              e('div', { style: { fontSize: 17, letterSpacing: 0.5, color: f.color } }, f.cat)
            ),
            e('div', { style: { display: "flex", flexWrap: "wrap", gap: 6 } },
              f.items.map((it, j) =>
                e('span', { key: j, style: { fontFamily: "'DM Sans', sans-serif", background: "#0a0a0a", border: "1px solid #1a1a1a", color: "#aaa", fontSize: 12, padding: "6px 10px", borderRadius: 7 } }, it)
              )
            )
          )
        )
      ),
      e('div', { style: { marginTop: 14, background: "#0a0a00", border: `1px solid ${LIME}15`, borderRadius: 10, padding: "14px 16px", fontFamily: "'DM Sans', sans-serif", color: "#888", fontSize: 12, lineHeight: 1.7 } },
        e('div', { style: { fontFamily: "'Bebas Neue', sans-serif", color: LIME, fontSize: 16, marginBottom: 6, letterSpacing: 0.5 } }, "DIE TELLER-FORMEL"),
        "½ Teller Gemüse (Volumen) · ¼ Protein · ¼ Carbs · ein Daumen Fett. So wirst du satt, triffst die Makros und musst kaum rechnen."
      )
    ),

    // ════════ TAB: FEHLER ════════
    tab === "fail" && e('div', { style: { padding: "16px 20px 32px" } },
      eyebrow("Die Fehler, die dein Defizit killen", 14),
      e('div', { style: { display: "flex", flexDirection: "column", gap: 8 } },
        MISTAKES.map((m, i) =>
          e('div', { key: i, style: { background: "#0c0c0c", border: "1px solid #161616", borderRadius: 12, padding: "14px 16px" } },
            e('div', { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 6 } },
              e('span', { style: { fontSize: 16 } }, "❌"),
              e('div', { style: { fontSize: 19, letterSpacing: 0.3, color: "#fff" } }, m.wrong)
            ),
            e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: "#888", fontSize: 13, lineHeight: 1.6, paddingLeft: 24 } }, m.right)
          )
        )
      ),
      e('div', { style: { marginTop: 16, textAlign: "center", fontFamily: "'DM Sans', sans-serif", color: "#333", fontSize: 11, lineHeight: 1.7 } },
        "Kein medizinischer Rat. Bei Vorerkrankungen oder Essstörung: erst mit Arzt sprechen.", e('br'),
        e('span', { style: { color: "#555" } }, "FIT NIIKITER · fitniikiter.com")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
