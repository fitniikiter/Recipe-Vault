// ── Persistence helpers ──────────────────────────────────────────
const load = (key, fallback) => { try { return localStorage.getItem(key) || fallback; } catch (_) { return fallback; } };
const save = (key, val) => { try { localStorage.setItem(key, val); } catch (_) {} };

function App() {
  const initTheme = load("flg-theme", (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark");

  const [lang, setLang] = useState("en"); // start language is always English
  const [langOpen, setLangOpen] = useState(false);
  const [themeId, setThemeId] = useState(initTheme);
  const [tab, setTab] = useState("start");
  const [isDesktop, setIsDesktop] = useState(typeof window !== "undefined" && window.innerWidth >= 760);

  // Calculator state
  const [sex, setSex] = useState("m");
  const [age, setAge] = useState(25);
  const [weight, setWeight] = useState(80);
  const [height, setHeight] = useState(180);
  const [act, setAct] = useState("mod");
  const [deficit, setDeficit] = useState("std");

  const t = T[lang];
  const theme = THEMES[themeId];
  const A = theme.accent;
  const isLight = themeId === "light";

  // Apply body background + persist on change
  useEffect(() => {
    document.body.style.background = theme.bg;
    document.documentElement.lang = t.htmlLang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr"; // Arabic is right-to-left
  }, [theme.bg, t.htmlLang, lang]);
  useEffect(() => { save("flg-lang", lang); }, [lang]);
  useEffect(() => { save("flg-theme", themeId); }, [themeId]);

  // Responsive listener
  useEffect(() => {
    const onResize = () => setIsDesktop(window.innerWidth >= 760);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const result = useMemo(() => {
    const w = Number(weight) || 0, h = Number(height) || 0, a = Number(age) || 0;
    if (!w || !h || !a) return null;
    const bmr = sex === "m" ? 10 * w + 6.25 * h - 5 * a + 5 : 10 * w + 6.25 * h - 5 * a - 161;
    const tdee = Math.round(bmr * ACT_MULT[act]);
    const target = Math.round(tdee * (1 - DEF_PCT[deficit]));
    const kcalCut = tdee - target;
    const weekLoss = (kcalCut * 7 / 7700); // ~7700 kcal per kg of fat
    const protein = Math.round(w * 2);
    const fat = Math.round(w * 0.9);
    const carbs = Math.max(0, Math.round((target - protein * 4 - fat * 9) / 4));
    return { bmr: Math.round(bmr), tdee, target, kcalCut, weekLoss, protein, fat, carbs, colorKey: DEF_COLOR[deficit] };
  }, [sex, age, weight, height, act, deficit]);

  const maxW = isDesktop ? 960 : 500;
  const cols2 = isDesktop ? "1fr 1fr" : "1fr";

  const eyebrow = (txt, mb = 10) => e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.faint, fontSize: 9, letterSpacing: 3, textTransform: "uppercase", marginBottom: mb } }, txt);

  const numberField = (label, val, set, unit) => e('div', { style: { background: theme.card, border: `1px solid ${theme.border}`, borderRadius: 10, padding: "10px 14px", flex: 1 } },
    e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.faint, fontSize: 9, letterSpacing: 2, textTransform: "uppercase" } }, label),
    e('div', { style: { display: "flex", alignItems: "baseline", gap: 5 } },
      e('input', { type: "number", inputMode: "numeric", value: val, onChange: ev => set(ev.target.value), style: { width: "100%", background: "transparent", border: "none", color: theme.text, fontSize: 30, outline: "none", letterSpacing: 1, fontFamily: "'Bebas Neue', sans-serif" } }),
      e('span', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.faint, fontSize: 13 } }, unit)
    )
  );

  // ── Top-right controls: theme toggle + language flags ──
  const ctrlBtn = (content, onClick, active, title) => e('button', {
    className: "btn", onClick, title,
    style: { width: 34, height: 34, borderRadius: 9, fontSize: 16, lineHeight: 1, display: "flex", alignItems: "center", justifyContent: "center", background: theme.card, border: `1px solid ${active ? A.lime : theme.border}`, color: theme.text, fontFamily: "'DM Sans', sans-serif" }
  }, content);

  const currentLang = LANGS.find(l => l.id === lang) || LANGS[0];

  const controls = e('div', { style: { position: "absolute", top: 14, right: 14, display: "flex", gap: 6, alignItems: "center", zIndex: 30 } },
    ctrlBtn(isLight ? "🌙" : "☀️", () => setThemeId(isLight ? "dark" : "light"), false, isLight ? "Dark mode" : "Light mode"),
    // Language dropdown: tap the flag to expand the list
    e('div', { style: { position: "relative" } },
      e('button', { className: "btn", onClick: () => setLangOpen(o => !o), title: "Language",
        style: { height: 34, borderRadius: 9, padding: "0 9px", display: "flex", alignItems: "center", gap: 5, background: theme.card, border: `1px solid ${langOpen ? A.lime : theme.border}`, color: theme.text, fontFamily: "'DM Sans', sans-serif" } },
        e('span', { style: { fontSize: 16, lineHeight: 1 } }, currentLang.flag),
        e('span', { style: { fontSize: 8, color: theme.faint, transform: langOpen ? "rotate(180deg)" : "none", transition: "transform 0.2s" } }, "▼")
      ),
      langOpen && e(Fragment, null,
        // Invisible backdrop to close on outside tap
        e('div', { onClick: () => setLangOpen(false), style: { position: "fixed", inset: 0, zIndex: 28 } }),
        e('div', { style: { position: "absolute", top: 41, right: 0, zIndex: 29, background: theme.card, border: `1px solid ${theme.border}`, borderRadius: 11, padding: 5, minWidth: 156, boxShadow: "0 10px 30px rgba(0,0,0,0.35)" } },
          LANGS.map(l =>
            e('button', { key: l.id, className: "btn", onClick: () => { setLang(l.id); setLangOpen(false); },
              style: { display: "flex", alignItems: "center", gap: 10, width: "100%", textAlign: "left", padding: "9px 11px", borderRadius: 8, background: lang === l.id ? (isLight ? "#eef1f5" : "#181818") : "transparent", color: theme.text, fontFamily: "'DM Sans', sans-serif", fontSize: 14 } },
              e('span', { style: { fontSize: 18, lineHeight: 1 } }, l.flag),
              e('span', null, l.name),
              lang === l.id && e('span', { style: { marginLeft: "auto", color: A.lime, fontSize: 13 } }, "✓")
            )
          )
        )
      )
    )
  );

  // ── Reusable building blocks ──
  const stepCard = (s) => e('div', { key: s.num, style: { background: theme.cardAlt, border: `1px solid ${theme.border}`, borderRadius: 12, padding: "16px", display: "flex", gap: 14, position: "relative", overflow: "hidden", alignItems: "flex-start" } },
    e('div', { style: { position: "absolute", left: 0, top: 0, bottom: 0, width: 3, background: A[s.color] } }),
    e('div', { style: { fontSize: 34, color: A[s.color], lineHeight: 0.9, flexShrink: 0, minWidth: 34 } }, s.num),
    e('div', null,
      e('div', { style: { fontSize: 21, letterSpacing: 0.3, lineHeight: 1.05, color: theme.text } }, s.title),
      e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.sub, fontSize: 13, marginTop: 6, lineHeight: 1.6 } }, s.body),
      s.cta && e('button', { className: "btn", onClick: () => { setTab("calc"); window.scrollTo({ top: 0, behavior: "smooth" }); }, style: { marginTop: 12, background: A.lime, color: theme.onAccent, fontFamily: "'Bebas Neue', sans-serif", fontSize: 15, letterSpacing: 1, padding: "9px 16px", borderRadius: 8 } }, s.cta)
    )
  );

  // ── Button linking to the main Recipe Vault page ──
  const recipeBtn = (mt = 12) => e('a', { href: "index.html", className: "btn", style: { display: "flex", alignItems: "center", justifyContent: "center", gap: 8, textDecoration: "none", marginTop: mt, background: A.lime, color: theme.onAccent, fontFamily: "'Bebas Neue', sans-serif", fontSize: 19, letterSpacing: 1, padding: "15px", borderRadius: 11 } }, t.recipesCta);

  // ── CALC sections ──
  const dataSection = e('div', null,
    eyebrow(t.calc.dataLabel),
    e('div', { style: { display: "flex", background: theme.cardAlt, borderRadius: 10, padding: 4, border: `1px solid ${theme.border}`, marginBottom: 10 } },
      [{ id: "m", l: t.calc.male }, { id: "w", l: t.calc.female }].map(o =>
        e('button', { key: o.id, className: "btn", onClick: () => setSex(o.id), style: { flex: 1, padding: "10px", borderRadius: 7, fontSize: 17, letterSpacing: 1, background: sex === o.id ? A.lime : "transparent", color: sex === o.id ? theme.onAccent : theme.faint, fontFamily: "'Bebas Neue', sans-serif" } }, o.l)
      )
    ),
    e('div', { style: { display: "flex", gap: 8 } },
      numberField(t.calc.age, age, setAge, t.calc.ageUnit),
      numberField(t.calc.weight, weight, setWeight, t.calc.weightUnit),
      numberField(t.calc.height, height, setHeight, t.calc.heightUnit)
    )
  );

  const activitySection = e('div', { style: { marginTop: 16 } },
    eyebrow(t.calc.activityLabel),
    e('div', { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7 } },
      t.activity.map(o =>
        e('button', { key: o.id, className: "btn", onClick: () => setAct(o.id), style: { textAlign: "left", padding: "11px 13px", borderRadius: 10, background: act === o.id ? (isLight ? "#f3f7e3" : "#11140a") : theme.cardAlt, border: `1px solid ${act === o.id ? A.lime + "99" : theme.border}`, fontFamily: "'Bebas Neue', sans-serif" } },
          e('div', { style: { fontSize: 18, color: act === o.id ? A.lime : theme.sub, letterSpacing: 0.5 } }, o.label),
          e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.faint, fontSize: 10, marginTop: 2 } }, o.sub)
        )
      )
    )
  );

  const tempoSection = e('div', { style: { marginTop: 16 } },
    eyebrow(t.calc.paceLabel),
    e('div', { style: { display: "flex", gap: 7 } },
      t.deficits.map(o => {
        const c = A[DEF_COLOR[o.id]];
        return e('button', { key: o.id, className: "btn", onClick: () => setDeficit(o.id), style: { flex: 1, padding: "12px 6px", borderRadius: 10, textAlign: "center", background: deficit === o.id ? c : theme.cardAlt, color: deficit === o.id ? theme.onAccent : theme.faint, border: `1px solid ${deficit === o.id ? c : theme.border}`, fontFamily: "'Bebas Neue', sans-serif" } },
          e('div', { style: { fontSize: 17, letterSpacing: 0.5 } }, o.label),
          e('div', { style: { fontFamily: "'DM Sans', sans-serif", fontSize: 9, marginTop: 3, opacity: 0.85 } }, `-${DEF_PCT[o.id] * 100}%`)
        );
      })
    ),
    e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.faint, fontSize: 10, marginTop: 8, textAlign: "center" } }, t.deficits.find(x => x.id === deficit).sub)
  );

  const resultSection = result && e('div', { className: "pop", key: result.target + themeId + lang },
    eyebrow(t.calc.resultLabel),
    e('div', { style: { background: theme.card, border: `1px solid ${A[result.colorKey]}55`, borderRadius: 14, padding: "18px", textAlign: "center", position: "relative", overflow: "hidden" } },
      e('div', { style: { position: "absolute", top: -40, right: -40, width: 160, height: 160, background: `radial-gradient(circle, ${A[result.colorKey]}22 0%, transparent 65%)`, pointerEvents: "none" } }),
      e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.faint, fontSize: 9, letterSpacing: 2, textTransform: "uppercase" } }, t.calc.targetTitle),
      e('div', { style: { fontSize: 68, color: A[result.colorKey], lineHeight: 1, margin: "4px 0" } }, result.target),
      e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.sub, fontSize: 12 } }, t.calc.under(result.kcalCut, result.weekLoss.toFixed(2)))
    ),
    e('div', { style: { display: "flex", gap: 7, marginTop: 7 } },
      [{ l: t.calc.bmr, v: result.bmr }, { l: t.calc.tdee, v: result.tdee }].map((x, i) =>
        e('div', { key: i, style: { flex: 1, background: theme.cardAlt, border: `1px solid ${theme.border}`, borderRadius: 10, padding: "11px 13px" } },
          e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.faint, fontSize: 9, letterSpacing: 1.5, textTransform: "uppercase" } }, x.l),
          e('div', { style: { fontSize: 26, color: theme.sub, lineHeight: 1.1, marginTop: 2 } }, `${x.v}`, e('span', { style: { fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: theme.faint } }, " kcal"))
        )
      )
    ),
    e('div', { style: { marginTop: 14 } },
      eyebrow(t.calc.macrosLabel),
      e('div', { style: { display: "flex", gap: 7 } },
        [{ l: t.calc.protein, v: result.protein, c: A.orange }, { l: t.calc.carbs, v: result.carbs, c: A.blue }, { l: t.calc.fat, v: result.fat, c: A.purple }].map((m, i) =>
          e('div', { key: i, style: { flex: 1, background: theme.card, border: `1px solid ${theme.border}`, borderRadius: 10, padding: "12px 10px", textAlign: "center" } },
            e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.faint, fontSize: 9, letterSpacing: 1, textTransform: "uppercase" } }, m.l),
            e('div', { style: { fontSize: 30, color: m.c, lineHeight: 1.1, marginTop: 3 } }, `${m.v}`, e('span', { style: { fontSize: 14, color: theme.faint } }, "g"))
          )
        )
      )
    ),
    e('div', { style: { marginTop: 12, background: isLight ? "#fbfbef" : "#0a0a00", border: `1px solid ${A.lime}30`, borderRadius: 10, padding: "12px 14px", fontFamily: "'DM Sans', sans-serif", color: theme.sub, fontSize: 12, lineHeight: 1.65 } }, t.calc.note)
  );

  return e('div', { style: { fontFamily: "'Bebas Neue', Impact, sans-serif", background: theme.bg, minHeight: "100vh", color: theme.text, maxWidth: maxW, margin: "0 auto", position: "relative", transition: "background 0.25s ease, color 0.25s ease" } },

    controls,

    // ── HEADER ──
    e('div', { style: { padding: isDesktop ? "34px 28px 24px" : "28px 20px 20px", borderBottom: `1px solid ${theme.line}`, position: "relative", overflow: "hidden" } },
      e('div', { style: { position: "absolute", top: -50, right: -50, width: 220, height: 220, background: `radial-gradient(circle, ${A.lime}1f 0%, transparent 65%)`, pointerEvents: "none" } }),
      eyebrow(t.eyebrow, 6),
      e('div', { style: { fontSize: isDesktop ? 64 : "clamp(30px, 9vw, 52px)", lineHeight: 0.95, letterSpacing: 2 } }, t.title),
      e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.sub, fontSize: isDesktop ? 14 : 12, marginTop: 10 } }, t.subtitle)
    ),

    // ── TABS ──
    e('div', { style: { display: "flex", background: theme.cardAlt, borderBottom: `1px solid ${theme.line}`, position: "sticky", top: 0, zIndex: 10 } },
      Object.keys(t.tabs).map(id =>
        e('button', { key: id, className: "btn", onClick: () => setTab(id), style: { flex: 1, padding: "13px 2px", fontSize: 13, letterSpacing: 0.5, background: "transparent", color: tab === id ? A.lime : theme.faint, borderBottom: `2px solid ${tab === id ? A.lime : "transparent"}`, fontFamily: "'Bebas Neue', sans-serif" } }, t.tabs[id])
      )
    ),

    // ════════ TAB: START ════════
    tab === "start" && e('div', { style: { padding: isDesktop ? "20px 28px 36px" : "16px 20px 32px" } },
      eyebrow(t.startHeading, 14),
      e('div', { style: { display: "grid", gridTemplateColumns: cols2, gap: 8 } }, t.steps.map(stepCard)),
      recipeBtn(14)
    ),

    // ════════ TAB: RECHNER ════════
    tab === "calc" && e('div', { style: { padding: isDesktop ? "20px 28px 36px" : "16px 20px 32px", display: "flex", flexDirection: isDesktop ? "row" : "column", gap: isDesktop ? 22 : 16, alignItems: "flex-start" } },
      e('div', { style: { flex: 1, width: "100%" } }, dataSection, activitySection, tempoSection),
      e('div', { style: { flex: 1, width: "100%", position: isDesktop ? "sticky" : "static", top: 60 } }, resultSection)
    ),

    // ════════ TAB: REGELN ════════
    tab === "rules" && e('div', { style: { padding: isDesktop ? "20px 28px 36px" : "16px 20px 32px" } },
      eyebrow(t.rulesHeading, 14),
      e('div', { style: { display: "grid", gridTemplateColumns: cols2, gap: 8 } },
        t.rules.map((r, i) =>
          e('div', { key: i, className: "card", style: { background: theme.cardAlt, border: `1px solid ${theme.border}`, borderRadius: 12, padding: "16px", display: "flex", gap: 14, position: "relative", overflow: "hidden" } },
            e('div', { style: { position: "absolute", left: 0, top: 0, bottom: 0, width: 3, background: A[r.color] } }),
            e('div', { style: { fontSize: 30, color: A[r.color], lineHeight: 1, flexShrink: 0, minWidth: 30 } }, r.num),
            e('div', null,
              e('div', { style: { fontSize: 20, letterSpacing: 0.3, lineHeight: 1.05 } }, r.title),
              e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.sub, fontSize: 13, marginTop: 6, lineHeight: 1.6 } }, r.body)
            )
          )
        )
      )
    ),

    // ════════ TAB: ESSEN ════════
    tab === "food" && e('div', { style: { padding: isDesktop ? "20px 28px 36px" : "16px 20px 32px" } },
      eyebrow(t.foodHeading, 14),
      e('div', { style: { display: "grid", gridTemplateColumns: cols2, gap: 10 } },
        t.foods.map((f, i) =>
          e('div', { key: i, style: { background: theme.card, border: `1px solid ${A[f.color]}33`, borderRadius: 12, padding: "14px 16px" } },
            e('div', { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 10 } },
              e('div', { style: { width: 8, height: 8, borderRadius: "50%", background: A[f.color] } }),
              e('div', { style: { fontSize: 17, letterSpacing: 0.5, color: A[f.color] } }, f.cat)
            ),
            e('div', { style: { display: "flex", flexWrap: "wrap", gap: 6 } },
              f.items.map((it, j) =>
                e('span', { key: j, style: { fontFamily: "'DM Sans', sans-serif", background: theme.chipBg, border: `1px solid ${theme.chipBorder}`, color: theme.chipText, fontSize: 12, padding: "6px 10px", borderRadius: 7 } }, it)
              )
            )
          )
        )
      ),
      e('div', { style: { marginTop: 14, background: isLight ? "#fbfbef" : "#0a0a00", border: `1px solid ${A.lime}30`, borderRadius: 10, padding: "14px 16px", fontFamily: "'DM Sans', sans-serif", color: theme.sub, fontSize: 12, lineHeight: 1.7 } },
        e('div', { style: { fontFamily: "'Bebas Neue', sans-serif", color: A.lime, fontSize: 16, marginBottom: 6, letterSpacing: 0.5 } }, t.plateTitle),
        t.plateBody
      ),
      recipeBtn(12)
    ),

    // ════════ TAB: FEHLER ════════
    tab === "fail" && e('div', { style: { padding: isDesktop ? "20px 28px 36px" : "16px 20px 32px" } },
      eyebrow(t.failHeading, 14),
      e('div', { style: { display: "grid", gridTemplateColumns: cols2, gap: 8 } },
        t.mistakes.map((m, i) =>
          e('div', { key: i, style: { background: theme.cardAlt, border: `1px solid ${theme.border}`, borderRadius: 12, padding: "14px 16px" } },
            e('div', { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 6 } },
              e('span', { style: { fontSize: 16 } }, "❌"),
              e('div', { style: { fontSize: 19, letterSpacing: 0.3, color: theme.text } }, m.wrong)
            ),
            e('div', { style: { fontFamily: "'DM Sans', sans-serif", color: theme.sub, fontSize: 13, lineHeight: 1.6, paddingLeft: 24 } }, m.right)
          )
        )
      ),
      e('div', { style: { marginTop: 16, textAlign: "center", fontFamily: "'DM Sans', sans-serif", color: theme.faint, fontSize: 11, lineHeight: 1.7 } },
        t.disclaimer, e('br'),
        e('span', { style: { color: theme.sub } }, "FIT NIIKITER · fitniikiter.com")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
